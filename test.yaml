name: CodeMender Manual Trigger

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'CodeMender Command'
        required: true
        type: choice
        options:
          - 'find'
          - 'verify'
          - 'fix'
          - 'hunt'
          - 'all (find -> verify -> fix)'
        default: 'find'
      target_ref:
        description: 'Target Branch, Tag, or Commit SHA'
        required: true
        default: 'main'
      target_path:
        description: 'Directory to scan ("all" for parallel per-folder scan, or specify e.g. "dvga", "juice-shop", or "." for monolithic)'
        required: false
        default: 'all'
      vuln_id:
        description: 'Vulnerability ID (e.g. 4149b888)'
        required: false
        default: ''
      auto_create_pr:
        description: 'Automatically author remediation PR upon fix'
        required: true
        type: boolean
        default: true
      skip_exploit_verification:
        description: 'Skip dynamic exploit execution during verify (static verification only)'
        required: false
        type: boolean
        default: false
      bq_project_id:
        description: 'GCP Project ID hosting BigQuery codemender.findings for codemender-mcp-server (defaults to vars.BQ_PROJECT_ID / vars.GCP_PROJECT_ID / cm-gh-506516)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  setup:
    name: Determine Scan Targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.determine_targets.outputs.targets }}
      commit_sha: ${{ steps.determine_targets.outputs.commit_sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Resolve Target Directories & Commit SHA
        id: determine_targets
        env:
          TARGET_PATH: ${{ inputs.target_path }}
          CMD: ${{ inputs.command }}
        run: |
          python3 -c '
          import os, json, subprocess

          target_path = os.environ.get("TARGET_PATH", "all").strip()
          cmd = os.environ.get("CMD", "find").strip()

          if cmd in ["verify", "fix", "hunt"] or target_path in [".", "root"]:
              targets = ["."]
          elif target_path in ["all", "all (parallel)", "*", ""]:
              if os.path.isdir("dvga") and os.path.isdir("juice-shop"):
                  targets = ["dvga", "juice-shop"]
              else:
                  targets = ["."]
          elif "," in target_path:
              targets = [p.strip() for p in target_path.split(",") if p.strip()]
          else:
              targets = [target_path]

          commit_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          print(f"Discovered targets: {targets} at commit {commit_sha}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"targets={json.dumps(targets)}\n")
              f.write(f"commit_sha={commit_sha}\n")
          '

  manual-codemender-run:
    name: CodeMender [${{ matrix.target_path }}]
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation OIDC token
      security-events: write
      checks: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target_path: ${{ fromJson(needs.setup.outputs.targets) }}
    steps:
      - name: Slugify Target Path
        id: slug
        env:
          TARGET: ${{ matrix.target_path }}
        run: |
          if [ "${TARGET}" = "." ]; then
            SLUG="root"
          else
            SLUG=$(echo "${TARGET}" | tr '/.' '_-')
          fi
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: 'projects/675447268546/locations/global/workloadIdentityPools/codemender-pool/providers/github-provider'
          service_account: 'codemender-ci-dispatcher@cm-gh-506516.iam.gserviceaccount.com'

      - name: Trigger Cloud Run Worker Job
        id: run_worker
        env:
          REPO_NAME: ${{ github.repository }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_PATH: ${{ matrix.target_path }}
          CMD: ${{ inputs.command }}
          VULN_ID: ${{ inputs.vuln_id }}
          AUTO_PR: ${{ inputs.auto_create_pr }}
          SKIP_EXPLOIT: ${{ inputs.skip_exploit_verification }}
          ACTOR_NAME: ${{ github.actor }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-west1' }}
        run: |
          EFFECTIVE_AUTO_PR="${AUTO_PR}"
          if [[ "${CMD}" == all* ]]; then
            EFFECTIVE_AUTO_PR="true"
          fi
          echo "🚀 Triggering Cloud Run execution for ${REPO_NAME} (${TARGET_REF}, path: ${TARGET_PATH})..."
          for attempt in 1 2 3 4; do
            if gcloud run jobs execute codemender-worker \
              --quiet \
              --region="${GCP_REGION}" \
              --wait \
              --update-env-vars="REPO=${REPO_NAME},REF=${TARGET_REF},COMMAND=bash /entrypoint.sh,CM_ACTION=${CMD},SCAN_MODE=deep,SCAN_MODEL=gemini-4-argon,REMEDIATION_MODEL=gemini-4-argon,TARGET_PATH=${TARGET_PATH},VULN_ID=${VULN_ID},SKIP_EXPLOIT_VERIFICATION=${SKIP_EXPLOIT},AUTO_PR=${EFFECTIVE_AUTO_PR},TRIGGER=manual,ACTOR=${ACTOR_NAME},ARTIFACTS_BUCKET=codemender-artifacts-cm-gh-506516"; then
              break
            fi
            if [ "${attempt}" -lt 4 ]; then
              echo "⏳ Attempt ${attempt} failed (WIF IAM may still be propagating); retrying in 20s..."
              sleep 20
            else
              exit 1
            fi
          done

      - name: Generate Live Monitoring & Summary Links
        if: always()
        env:
          CMD: ${{ inputs.command }}
          TARGET_REF: ${{ inputs.target_ref }}
          COMMIT_SHA: ${{ needs.setup.outputs.commit_sha }}
          TARGET_PATH: ${{ matrix.target_path }}
          VULN_ID: ${{ inputs.vuln_id || 'N/A' }}
          ACTOR_NAME: ${{ github.actor }}
          BQ_PROJECT_ID: ${{ inputs.bq_project_id || vars.BQ_PROJECT_ID || vars.GCP_PROJECT_ID || 'cm-gh-506516' }}
          BQ_DATASET: ${{ vars.BQ_DATASET || 'codemender' }}
          BQ_TABLE: ${{ vars.BQ_TABLE || 'findings' }}
        run: |
          CONSOLE_LOGS="https://console.cloud.google.com/run/jobs/details/us-west1/codemender-worker/executions?project=cm-gh-506516"
          if [ "${CMD}" = "verify" ] || [ "${CMD}" = "fix" ]; then
            MODEL_SUMMARY="gemini-4-argon"
          elif [ "${CMD}" = "find" ]; then
            MODEL_SUMMARY="gemini-4-argon (--deep)"
          else
            MODEL_SUMMARY="gemini-4-argon (--deep / fix)"
          fi

          echo "## 🛡️ CodeMender Manual Run Dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Command** | \`${CMD}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Model** | \`${MODEL_SUMMARY}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target Ref** | \`${TARGET_REF}\` (\`${COMMIT_SHA:0:8}\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target Path** | \`${TARGET_PATH}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Vuln ID** | \`${VULN_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **BigQuery MCP Table** | \`${BQ_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered By** | @${ACTOR_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Cloud Run Console** | [View Real-Time Logs & Traces](${CONSOLE_LOGS}) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Download & Publish Artifacts
        if: always()
        env:
          REPO_NAME: ${{ github.repository }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_PATH: ${{ matrix.target_path }}
          CMD: ${{ inputs.command }}
          VULN_ID: ${{ inputs.vuln_id }}
        run: |
          mkdir -p ./cm-artifacts
          BASE_GCS="gs://codemender-artifacts-cm-gh-506516/${REPO_NAME}/${TARGET_REF}"
          if [ "${CMD}" = "verify" ] && [ -n "${VULN_ID}" ]; then
            gcloud storage cp --quiet -r "${BASE_GCS}/verify/*${VULN_ID}/*" ./cm-artifacts/ 2>/dev/null \
              || gcloud storage cp --quiet -r "${BASE_GCS}/verify/*" ./cm-artifacts/ 2>/dev/null || true
          elif [ "${CMD}" = "fix" ] && [ -n "${VULN_ID}" ]; then
            gcloud storage cp --quiet -r "${BASE_GCS}/fix/*${VULN_ID}/*" ./cm-artifacts/ 2>/dev/null \
              || gcloud storage cp --quiet -r "${BASE_GCS}/fix/*" ./cm-artifacts/ 2>/dev/null || true
          elif [ "${CMD}" = "hunt" ] && [ -n "${VULN_ID}" ]; then
            gcloud storage cp --quiet -r "${BASE_GCS}/hunt/*${VULN_ID}/*" ./cm-artifacts/ 2>/dev/null \
              || gcloud storage cp --quiet -r "${BASE_GCS}/hunt/*" ./cm-artifacts/ 2>/dev/null || true
          elif [ "${TARGET_PATH}" != "." ]; then
            SLUG=$(echo "${TARGET_PATH}" | tr '/' '_')
            gcloud storage cp --quiet -r "${BASE_GCS}/${SLUG}/*" ./cm-artifacts/ || true
          else
            gcloud storage cp --quiet -r "${BASE_GCS}/*" ./cm-artifacts/ || true
          fi
          if [ -f ./cm-artifacts/summary.md ]; then
            cat ./cm-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f ./cm-artifacts/cm-find.log ]; then
            echo "<details><summary>📄 Raw CodeMender CLI Output [${TARGET_PATH}]</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat ./cm-artifacts/cm-find.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Authenticate to BigQuery Target Project (Optional Separate WIF)
        if: always() && ((vars.BQ_WIF_PROVIDER != '' && vars.BQ_SA_EMAIL != '') || (vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''))
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: ${{ vars.BQ_WIF_PROVIDER || vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.BQ_SA_EMAIL || vars.GCP_SA_EMAIL }}

      - name: Upload Findings to BigQuery (CodeMender MCP Table)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          TARGET_REF: ${{ inputs.target_ref }}
          COMMIT_SHA: ${{ needs.setup.outputs.commit_sha }}
          TARGET_PATH: ${{ matrix.target_path }}
          SLUG: ${{ steps.slug.outputs.slug }}
          CMD: ${{ inputs.command }}
          VULN_ID: ${{ inputs.vuln_id }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACTS_BUCKET: codemender-artifacts-cm-gh-506516
          WORKER_PROJECT_ID: cm-gh-506516
          BQ_PROJECT_ID: ${{ inputs.bq_project_id || vars.BQ_PROJECT_ID || vars.GCP_PROJECT_ID || 'cm-gh-506516' }}
          BQ_DATASET: ${{ vars.BQ_DATASET || 'codemender' }}
          BQ_TABLE: ${{ vars.BQ_TABLE || 'findings' }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION || 'US' }}
        run: |
          python3 - << 'PYEOF'
          import datetime
          import hashlib
          import json
          import os
          import random
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          IDENTIFIER_RE = re.compile(r"^[A-Za-z0-9_\-]{1,128}$")
          HEX_ID_RE = re.compile(r"^[0-9a-fA-F]{8}(?:-[0-9a-fA-F\-]+|[0-9a-fA-F]*)$")

          # Exact canonical 18-column schema read by codemender-mcp-server (codemender.findings)
          SCHEMA_FIELDS = [
              {"name": "finding_id", "type": "STRING", "mode": "REQUIRED", "description": "CodeMender finding ID, e.g. CM-0001."},
              {"name": "issue_id", "type": "STRING", "mode": "NULLABLE", "description": "Issue ID used across tools and logs."},
              {"name": "session_id", "type": "STRING", "mode": "NULLABLE", "description": "CodeMender scan session ID."},
              {"name": "repository", "type": "STRING", "mode": "NULLABLE", "description": "Repository as owner/name."},
              {"name": "commit_sha", "type": "STRING", "mode": "NULLABLE", "description": "Commit scanned."},
              {"name": "file_path", "type": "STRING", "mode": "NULLABLE", "description": "File containing the finding."},
              {"name": "line_number", "type": "INTEGER", "mode": "NULLABLE", "description": "Line number of the finding."},
              {"name": "title", "type": "STRING", "mode": "NULLABLE", "description": "Short title."},
              {"name": "description", "type": "STRING", "mode": "NULLABLE", "description": "Finding description."},
              {"name": "vulnerability_type", "type": "STRING", "mode": "NULLABLE", "description": "Vulnerability class, e.g. SQL_INJECTION."},
              {"name": "cwe_id", "type": "STRING", "mode": "NULLABLE", "description": "CWE identifier, e.g. CWE-89."},
              {"name": "severity", "type": "STRING", "mode": "NULLABLE", "description": "CRITICAL|HIGH|MEDIUM|LOW."},
              {"name": "status", "type": "STRING", "mode": "NULLABLE", "description": "DETECTED|OPEN|PATCH_GENERATED|VERIFIED|APPLIED|FIXED|FAILED|FALSE_POSITIVE."},
              {"name": "patch_ref", "type": "STRING", "mode": "NULLABLE", "description": "Reference to the generated patch (GCS URI or branch)."},
              {"name": "pr_url", "type": "STRING", "mode": "NULLABLE", "description": "Pull request URL, if opened."},
              {"name": "wiz_issue_id", "type": "STRING", "mode": "NULLABLE", "description": "Related Wiz issue ID, if any."},
              {"name": "created_at", "type": "TIMESTAMP", "mode": "REQUIRED", "description": "Creation time. Partition column."},
              {"name": "updated_at", "type": "TIMESTAMP", "mode": "NULLABLE", "description": "Last update time."},
          ]

          CWE_TYPE_MAP = [
              (("sql injection", "sqli", "cwe-89"), ("CWE-89", "SQL_INJECTION")),
              (("nosql injection", "cwe-943"), ("CWE-943", "NOSQL_INJECTION")),
              (("cross-site scripting", "xss", "cwe-79"), ("CWE-79", "XSS")),
              (("open redirect", "unvalidated redirect", "cwe-601"), ("CWE-601", "OPEN_REDIRECT")),
              (("os command injection", "command injection", "cwe-78"), ("CWE-78", "COMMAND_INJECTION")),
              (("remote code execution", "rce", "code injection", "cwe-94"), ("CWE-94", "CODE_INJECTION")),
              (("path traversal", "directory traversal", "arbitrary file", "cwe-22"), ("CWE-22", "PATH_TRAVERSAL")),
              (("xml external entity", "xxe", "cwe-611"), ("CWE-611", "XXE")),
              (("server-side request forgery", "ssrf", "cwe-918"), ("CWE-918", "SSRF")),
              (("insecure direct object reference", "idor", "cwe-639"), ("CWE-639", "IDOR")),
              (("improper access control", "cwe-284"), ("CWE-284", "IMPROPER_ACCESS_CONTROL")),
              (("improper authentication", "authentication bypass", "cwe-287"), ("CWE-287", "IMPROPER_AUTHENTICATION")),
              (("hardcoded", "hard-coded", "cwe-798"), ("CWE-798", "HARDCODED_CREDENTIALS")),
              (("deserialization", "cwe-502"), ("CWE-502", "INSECURE_DESERIALIZATION")),
              (("csrf", "cross-site request forgery", "cwe-352"), ("CWE-352", "CSRF")),
              (("prototype pollution", "cwe-1321"), ("CWE-1321", "PROTOTYPE_POLLUTION")),
              (("excessive permission", "cwe-250"), ("CWE-250", "EXCESSIVE_PERMISSIONS")),
              (("outdated", "vulnerable component", "cwe-1104"), ("CWE-1104", "OUTDATED_COMPONENT")),
              (("security misconfiguration", "cwe-16"), ("CWE-16", "SECURITY_MISCONFIGURATION")),
              (("information disclosure", "improper restriction", "cwe-200"), ("CWE-200", "INFORMATION_DISCLOSURE")),
          ]


          def clean_file_path(path):
              if not path:
                  return None
              p = str(path).strip()
              for prefix in ("/workspace/repo/", "/workspace/"):
                  if p.startswith(prefix):
                      p = p[len(prefix):]
              if os.path.isabs(p) and "/repo/" in p:
                  p = p.split("/repo/", 1)[1]
              p = re.sub(r"^\.?/+", "", p)
              p = re.sub(r"^(\.\./)+", "", p)
              return p if p and p.lower() != "unknown" else None


          def is_internal_scaffold_file(path):
              clean_p = clean_file_path(path)
              if not clean_p:
                  return False
              return clean_p.startswith(("worker/", "scripts/", ".github/")) or clean_p in (".cmignore",)


          def normalize_ids(raw_id, repo, file_path, line_number, vuln_type):
              s = str(raw_id or "").strip()
              if s:
                  if HEX_ID_RE.match(s):
                      short_id = s[:8].lower()
                      return short_id, s
                  clean_s = re.sub(r"[^A-Za-z0-9._:\-]", "-", s)[:128]
                  return clean_s, clean_s
              seed = f"{repo}:{file_path or ''}:{line_number or 0}:{vuln_type or ''}"
              digest = hashlib.sha256(seed.encode("utf-8")).hexdigest()[:8]
              return digest, digest


          def normalize_severity(sev_raw):
              if not sev_raw:
                  return None
              s = re.sub(r"^[🔴🟠🟡🟢⚪ℹ️🛡️\s*]+", "", str(sev_raw)).strip().upper()
              if s in ("CRITICAL", "HIGH", "MEDIUM", "LOW"):
                  return s
              if s in ("MODERATE", "WARNING", "WARN"):
                  return "MEDIUM"
              if s in ("INFO", "INFORMATIONAL", "NOTE"):
                  return "LOW"
              if s == "ERROR":
                  return "HIGH"
              return None


          def normalize_cwe_and_type(cwe_raw, type_raw, title_raw=""):
              combined = f"{cwe_raw or ''} {type_raw or ''} {title_raw or ''}".lower()
              cwe_id = None
              m = re.search(r"\bcwe-(\d+)\b", combined, re.IGNORECASE)
              if m:
                  cwe_id = f"CWE-{m.group(1)}"

              vuln_type = None
              for keywords, (mapped_cwe, mapped_type) in CWE_TYPE_MAP:
                  if any(kw in combined for kw in keywords):
                      cwe_id = cwe_id or mapped_cwe
                      vuln_type = mapped_type
                      break

              if not vuln_type and type_raw:
                  cleaned_t = re.sub(r"\([^)]*\)", "", str(type_raw)).strip().upper()
                  cleaned_t = re.sub(r"[^A-Z0-9]+", "_", cleaned_t).strip("_")
                  if cleaned_t and cleaned_t not in ("SECURITY_FINDING", "UNKNOWN", "GENERIC"):
                      vuln_type = cleaned_t
                  elif cleaned_t:
                      vuln_type = cleaned_t

              return cwe_id, vuln_type


          def normalize_status(status_raw, default_status="OPEN"):
              if not status_raw:
                  return default_status
              s = str(status_raw).strip().upper()
              if s in ("DISMISSED", "FALSE_POSITIVE", "REJECTED", "IGNORED"):
                  return "FALSE_POSITIVE"
              if s in ("DETECTED", "OPEN", "PATCH_GENERATED", "VERIFIED", "APPLIED", "FIXED", "FAILED"):
                  return s
              return default_status


          def parse_int(val):
              if val is None or val == "" or isinstance(val, bool):
                  return None
              try:
                  iv = int(val)
                  return iv if iv > 0 else None
              except (TypeError, ValueError):
                  return None


          def clean_title(title_raw):
              if not title_raw:
                  return None
              t = str(title_raw).strip()
              t = re.sub(r"^\[CodeMender[^\]]*\]\s*", "", t)
              t = re.sub(r"^[🔴🟠🟡🟢⚪ℹ️🛡️]+\s*", "", t)
              t = re.sub(r"\s*\([0-9a-fA-F]{8}\)$", "", t).strip()
              return t or None


          def build_description(analysis_raw, desc_raw, snippet_raw):
              parts = []
              primary = str(analysis_raw or desc_raw or "").strip()
              if primary:
                  parts.append(primary)
              snippet = str(snippet_raw or "").strip()
              if snippet and snippet not in primary:
                  parts.append(f"Vulnerable snippet:\n{snippet}")
              if not parts:
                  return None
              return "\n\n".join(parts)[:16000]


          def normalize_command(cmd_raw):
              c = (cmd_raw or "find").strip().lower()
              if c.startswith("all"):
                  return "all"
              for prefix in ("find", "verify", "fix", "hunt"):
                  if c.startswith(prefix):
                      return prefix
              return c


          def resolve_session_id(artifacts_dir, run_id, slug):
              for json_p in collect_artifact_files(artifacts_dir, {"findings.json"}):
                  try:
                      with open(json_p, "r", encoding="utf-8") as fh:
                          data = json.load(fh)
                      if isinstance(data, dict):
                          sid = data.get("session_id") or data.get("SessionID")
                          if sid:
                              return str(sid).strip()[:128]
                  except Exception:
                      pass
              if os.path.isdir(artifacts_dir):
                  for root, dirs, _files in os.walk(artifacts_dir):
                      if os.path.basename(root) == "cm-session-logs":
                          for name in sorted(os.listdir(root)):
                              if not name.startswith(".") and not name.endswith("-nosid.jsonl"):
                                  stem = os.path.splitext(name)[0]
                                  if stem:
                                      return stem[:128]
              suffix = f"-{slug}" if slug and slug != "root" else ""
              return f"gh-run-{run_id}{suffix}"


          def merge_record(target, incoming):
              for k, v in incoming.items():
                  if v is not None and v != "":
                      if target.get(k) in (None, ""):
                          target[k] = v
                      elif k in ("status", "patch_ref", "pr_url", "updated_at"):
                          target[k] = v
              return target


          def collect_artifact_files(artifacts_dir, filenames):
              matches = []
              if not os.path.isdir(artifacts_dir):
                  return matches
              for root, dirs, files in os.walk(artifacts_dir):
                  dirs[:] = [d for d in dirs if d not in (".git", "node_modules", "cm-session-logs")]
                  for fn in files:
                      if fn in filenames:
                          matches.append(os.path.join(root, fn))
              matches.sort(key=lambda p: (0 if os.path.dirname(p) == os.path.normpath(artifacts_dir) else 1, p))
              return matches


          def parse_json_findings(artifacts_dir, repo):
              records = {}
              for jp in collect_artifact_files(artifacts_dir, {"findings.json", "issue-finding.json"}):
                  try:
                      with open(jp, "r", encoding="utf-8") as fh:
                          data = json.load(fh)
                  except Exception as exc:
                      print(f"Notice: skipping unreadable JSON {jp}: {exc}", file=sys.stderr)
                      continue
                  if isinstance(data, list):
                      items = data
                  elif isinstance(data, dict):
                      items = data.get("findings") if isinstance(data.get("findings"), list) else ([data] if any(k in data for k in ("FindingID", "finding_id", "id", "FilePath", "file_path")) else [])
                  else:
                      items = []

                  for item in items:
                      if not isinstance(item, dict):
                          continue
                      raw_file = item.get("FilePath") or item.get("file_path") or item.get("File") or item.get("file") or item.get("path")
                      if is_internal_scaffold_file(raw_file):
                          continue
                      fp = clean_file_path(raw_file)
                      line_no = parse_int(item.get("StartLine") or item.get("start_line") or item.get("line_number") or item.get("line"))
                      raw_cwe = item.get("VulnID") or item.get("cwe_id") or item.get("cwe") or item.get("vuln_id")
                      raw_type = item.get("VulnType") or item.get("vulnerability_type") or item.get("vuln_type") or item.get("type")
                      title = clean_title(item.get("Title") or item.get("title"))
                      cwe_id, vuln_type = normalize_cwe_and_type(raw_cwe, raw_type, title or "")
                      raw_id = item.get("FindingID") or item.get("finding_id") or item.get("id")
                      fid, full_id = normalize_ids(raw_id, repo, fp, line_no, vuln_type)
                      sev = normalize_severity(item.get("Severity") or item.get("severity")) or "HIGH"
                      status = normalize_status(item.get("Status") or item.get("status"), "OPEN")
                      desc = build_description(
                          item.get("Analysis") or item.get("analysis"),
                          item.get("Description") or item.get("description") or item.get("message"),
                          item.get("Snippet") or item.get("snippet"),
                      )
                      wiz_id = str(item.get("wiz_issue_id") or "").strip() or None
                      rec = {
                          "finding_id": fid,
                          "issue_id": str(item.get("issue_id") or full_id).strip()[:128] or fid,
                          "session_id": str(item.get("session_id") or item.get("SessionID") or "").strip() or None,
                          "file_path": fp,
                          "line_number": line_no,
                          "title": title or (f"{vuln_type} in {fp}" if vuln_type and fp else f"CodeMender finding {fid}"),
                          "description": desc,
                          "vulnerability_type": vuln_type or "SECURITY_FINDING",
                          "cwe_id": cwe_id,
                          "severity": sev,
                          "status": status,
                          "patch_ref": str(item.get("patch_ref") or "").strip() or None,
                          "pr_url": str(item.get("pr_url") or "").strip() or None,
                          "wiz_issue_id": wiz_id,
                      }
                      records[fid] = merge_record(records.get(fid, {}), rec)
              return records


          def enrich_or_parse_sarif(artifacts_dir, repo, records):
              for sp in collect_artifact_files(artifacts_dir, {"codemender.sarif", "issue-sarif.json"}):
                  try:
                      with open(sp, "r", encoding="utf-8") as fh:
                          sdata = json.load(fh)
                  except Exception:
                      continue
                  for run in sdata.get("runs") or []:
                      rules = {
                          r.get("id"): r
                          for r in (run.get("tool", {}).get("driver", {}).get("rules") or [])
                          if isinstance(r, dict) and r.get("id")
                      }
                      for res in run.get("results") or []:
                          if not isinstance(res, dict):
                              continue
                          props = res.get("properties") or {}
                          locs = res.get("locations") or []
                          phys = (locs[0].get("physicalLocation") if locs and isinstance(locs[0], dict) else None) or {}
                          uri = (phys.get("artifactLocation") or {}).get("uri")
                          if is_internal_scaffold_file(uri):
                              continue
                          fp = clean_file_path(uri)
                          line_no = parse_int((phys.get("region") or {}).get("startLine"))
                          rule_id = res.get("ruleId") or ""
                          rule = rules.get(rule_id) or {}
                          tags = " ".join((rule.get("properties") or {}).get("tags") or [])
                          msg_text = ((res.get("message") or {}).get("text") or "").strip()
                          first_line = msg_text.splitlines()[0].strip() if msg_text else ""
                          title = clean_title(first_line or (rule.get("shortDescription") or {}).get("text") or rule_id)
                          cwe_id, vuln_type = normalize_cwe_and_type(
                              f"{props.get('vuln_id') or ''} {tags}",
                              props.get("vuln_type") or rule_id,
                              title or "",
                          )

                          # Match existing record by short_finding_id, finding_id, or (file_path, line_number)
                          raw_id = props.get("short_finding_id") or props.get("finding_id") or (res.get("partialFingerprints") or {}).get("primaryLocationLineHash")
                          matched_fid = None
                          if raw_id:
                              cand_fid, _ = normalize_ids(raw_id, repo, fp, line_no, vuln_type)
                              if cand_fid in records:
                                  matched_fid = cand_fid
                          if not matched_fid and fp:
                              for existing_fid, existing in records.items():
                                  if existing.get("file_path") == fp and (
                                      not existing.get("line_number") or not line_no or abs(existing["line_number"] - line_no) <= 5
                                  ):
                                      matched_fid = existing_fid
                                      break

                          sev = normalize_severity(props.get("severity"))
                          if not sev:
                              sec_sev = props.get("security-severity") or (rule.get("properties") or {}).get("security-severity")
                              try:
                                  score = float(sec_sev)
                                  sev = "CRITICAL" if score >= 9.0 else ("HIGH" if score >= 7.0 else ("MEDIUM" if score >= 4.0 else "LOW"))
                              except (TypeError, ValueError):
                                  lvl = str(res.get("level") or "").lower()
                                  sev = "HIGH" if lvl == "error" else ("MEDIUM" if lvl == "warning" else "LOW")

                          if matched_fid:
                              existing = records[matched_fid]
                              if not existing.get("line_number") and line_no:
                                  existing["line_number"] = line_no
                              if not existing.get("cwe_id") and cwe_id:
                                  existing["cwe_id"] = cwe_id
                              if not existing.get("description") and msg_text:
                                  existing["description"] = msg_text[:16000]
                              if not existing.get("file_path") and fp:
                                  existing["file_path"] = fp
                          else:
                              fid, full_id = normalize_ids(raw_id, repo, fp, line_no, vuln_type)
                              records[fid] = {
                                  "finding_id": fid,
                                  "issue_id": full_id[:128],
                                  "session_id": str(props.get("session_id") or "").strip() or None,
                                  "file_path": fp,
                                  "line_number": line_no,
                                  "title": title or f"CodeMender finding {fid}",
                                  "description": msg_text[:16000] if msg_text else None,
                                  "vulnerability_type": vuln_type or "SECURITY_FINDING",
                                  "cwe_id": cwe_id,
                                  "severity": sev or "HIGH",
                                  "status": normalize_status(props.get("status"), "OPEN"),
                                  "patch_ref": None,
                                  "pr_url": None,
                                  "wiz_issue_id": None,
                              }
              return records


          def parse_cli_log_fallback(artifacts_dir, repo):
              records = {}
              pattern = re.compile(
                  r"^([a-f0-9]{8})\s+([🔴🟠🟡🟢]?\s*[A-Z]+)\s+([A-Za-z0-9\s\/\-_]+?)\s{2,}([^\s]+?\.[a-zA-Z0-9]+)\s{2,}(.+?)\s{2,}(\d+%)",
                  re.MULTILINE,
              )
              for log_p in collect_artifact_files(artifacts_dir, {"cm-find.log"}):
                  try:
                      with open(log_p, "r", encoding="utf-8", errors="ignore") as fh:
                          content = re.sub(r"\x1b\[[0-9;]*[a-zA-Z]", "", fh.read())
                  except Exception:
                      continue
                  for match in pattern.finditer(content):
                      raw_id, raw_sev, raw_type, raw_file, raw_title, _conf = match.groups()
                      if is_internal_scaffold_file(raw_file):
                          continue
                      fp = clean_file_path(raw_file)
                      title = clean_title(raw_title)
                      cwe_id, vuln_type = normalize_cwe_and_type("", raw_type, title or "")
                      fid, full_id = normalize_ids(raw_id, repo, fp, None, vuln_type)
                      records[fid] = {
                          "finding_id": fid,
                          "issue_id": full_id,
                          "session_id": None,
                          "file_path": fp,
                          "line_number": None,
                          "title": title or f"CodeMender finding {fid}",
                          "description": None,
                          "vulnerability_type": vuln_type or "SECURITY_FINDING",
                          "cwe_id": cwe_id,
                          "severity": normalize_severity(raw_sev) or "HIGH",
                          "status": "OPEN",
                          "patch_ref": None,
                          "pr_url": None,
                          "wiz_issue_id": None,
                      }
              return records


          def fetch_github_context(repo):
              prs_by_fid = {}
              issues_by_fid = {}
              if not repo or not os.environ.get("GH_TOKEN"):
                  return prs_by_fid, issues_by_fid
              try:
                  pr_res = subprocess.run(
                      ["gh", "pr", "list", "--repo", repo, "--state", "all", "--limit", "100", "--json", "number,url,state,headRefName,title"],
                      capture_output=True,
                      text=True,
                      timeout=15,
                  )
                  if pr_res.returncode == 0 and pr_res.stdout.strip():
                      for pr in json.loads(pr_res.stdout):
                          head = str(pr.get("headRefName") or "")
                          title = str(pr.get("title") or "")
                          fid = None
                          if head.startswith("codemender/fix-"):
                              fid = head[len("codemender/fix-"):].strip().lower()
                          else:
                              m = re.search(r"\(([0-9a-fA-F]{8})\)", title)
                              if m:
                                  fid = m.group(1).lower()
                          if fid and fid not in prs_by_fid:
                              prs_by_fid[fid] = pr
              except Exception as exc:
                  print(f"Notice: gh pr list skipped: {exc}", file=sys.stderr)

              try:
                  iss_res = subprocess.run(
                      ["gh", "issue", "list", "--repo", repo, "--state", "all", "--search", "CodeMender", "--limit", "100", "--json", "number,title,body,labels"],
                      capture_output=True,
                      text=True,
                      timeout=15,
                  )
                  if iss_res.returncode == 0 and iss_res.stdout.strip():
                      for iss in json.loads(iss_res.stdout):
                          title = str(iss.get("title") or "")
                          body = str(iss.get("body") or "")
                          fid = None
                          m_meta = re.search(r"<!--\s*codemender-finding-metadata\s*\n(.*?)\n-->", body, re.DOTALL)
                          meta = {}
                          if m_meta:
                              try:
                                  meta = json.loads(m_meta.group(1))
                                  if meta.get("finding_id"):
                                      fid = str(meta["finding_id"]).strip().lower()
                              except Exception:
                                  meta = {}
                          if not fid:
                              m_fid = re.search(r"\(([0-9a-fA-F]{8})\)", title)
                              if m_fid:
                                  fid = m_fid.group(1).lower()
                          if fid and fid not in issues_by_fid:
                              iss["_parsed_meta"] = meta
                              issues_by_fid[fid] = iss
              except Exception as exc:
                  print(f"Notice: gh issue list skipped: {exc}", file=sys.stderr)

              return prs_by_fid, issues_by_fid


          def read_log_text(path):
              if not path or not os.path.isfile(path):
                  return ""
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as fh:
                      return fh.read()
              except Exception:
                  return ""


          def find_artifact_log(artifacts_dir, filename):
              direct = os.path.join(artifacts_dir, filename)
              if os.path.isfile(direct):
                  return read_log_text(direct)
              found = collect_artifact_files(artifacts_dir, {filename})
              return read_log_text(found[0]) if found else ""


          def evaluate_verify_log(log_text):
              if not log_text:
                  return None
              if "Finding DISMISSED" in log_text:
                  return "FALSE_POSITIVE"
              if "no finding matches prefix" in log_text or "Session FAILED" in log_text:
                  return "FAILED"
              if "Verified" in log_text or "exploitable" in log_text.lower() or "Static Verification Completed" in log_text:
                  return "VERIFIED"
              return None


          class BQPermissionError(RuntimeError):
              """Raised when the active identity lacks direct BigQuery IAM roles."""


          def bq_request(method, url, token, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode("utf-8")
                      return resp.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as err:
                  err_body = err.read().decode("utf-8", errors="replace")
                  try:
                      parsed = json.loads(err_body)
                  except Exception:
                      parsed = {"error": {"message": err_body}}
                  return err.code, parsed


          def ensure_dataset_and_table(token, bq_project, bq_dataset, bq_table, bq_location):
              ds_url = f"https://bigquery.googleapis.com/bigquery/v2/projects/{bq_project}/datasets/{bq_dataset}"
              code, resp = bq_request("GET", ds_url, token)
              if code == 404:
                  create_ds_url = f"https://bigquery.googleapis.com/bigquery/v2/projects/{bq_project}/datasets"
                  c_code, c_resp = bq_request(
                      "POST",
                      create_ds_url,
                      token,
                      {
                          "datasetReference": {"projectId": bq_project, "datasetId": bq_dataset},
                          "location": bq_location,
                          "description": "CodeMender findings used by codemender-mcp-server.",
                      },
                  )
                  if c_code == 403:
                      raise BQPermissionError(f"Failed to create dataset {bq_project}.{bq_dataset} (HTTP 403): {c_resp}")
                  if c_code not in (200, 201, 409):
                      raise RuntimeError(f"Failed to create dataset {bq_project}.{bq_dataset} (HTTP {c_code}): {c_resp}")
                  print(f"📦 Ensured BigQuery dataset {bq_project}.{bq_dataset}")
              elif code == 403:
                  raise BQPermissionError(
                      f"Cannot access BigQuery dataset {bq_project}.{bq_dataset} (HTTP 403): {resp}. "
                      f"Ensure the workflow service account has roles/bigquery.dataEditor on {bq_project}.{bq_dataset} "
                      f"and roles/bigquery.jobUser on {bq_project}."
                  )
              elif code != 200:
                  raise RuntimeError(f"Cannot access BigQuery dataset {bq_project}.{bq_dataset} (HTTP {code}): {resp}")

              tb_url = f"https://bigquery.googleapis.com/bigquery/v2/projects/{bq_project}/datasets/{bq_dataset}/tables/{bq_table}"
              t_code, t_resp = bq_request("GET", tb_url, token)
              if t_code == 404:
                  create_tb_url = f"https://bigquery.googleapis.com/bigquery/v2/projects/{bq_project}/datasets/{bq_dataset}/tables"
                  ct_code, ct_resp = bq_request(
                      "POST",
                      create_tb_url,
                      token,
                      {
                          "tableReference": {"projectId": bq_project, "datasetId": bq_dataset, "tableId": bq_table},
                          "description": "CodeMender findings.",
                          "schema": {"fields": SCHEMA_FIELDS},
                          "timePartitioning": {"type": "DAY", "field": "created_at"},
                      },
                  )
                  if ct_code == 403:
                      raise BQPermissionError(f"Failed to create table {bq_project}.{bq_dataset}.{bq_table} (HTTP 403): {ct_resp}")
                  if ct_code not in (200, 201, 409):
                      raise RuntimeError(f"Failed to create table {bq_project}.{bq_dataset}.{bq_table} (HTTP {ct_code}): {ct_resp}")
                  print(f"📦 Ensured partitioned BigQuery table {bq_project}.{bq_dataset}.{bq_table}")
              elif t_code == 403:
                  raise BQPermissionError(f"Cannot access BigQuery table {bq_project}.{bq_dataset}.{bq_table} (HTTP 403): {t_resp}")
              elif t_code != 200:
                  raise RuntimeError(f"Cannot access BigQuery table {bq_project}.{bq_dataset}.{bq_table} (HTTP {t_code}): {t_resp}")


          def build_merge_sql(full_table):
              return f"""
              MERGE {full_table} AS T
              USING (
                SELECT * EXCEPT(rn)
                FROM (
                  SELECT
                    JSON_VALUE(item, '$.finding_id') AS finding_id,
                    JSON_VALUE(item, '$.issue_id') AS issue_id,
                    JSON_VALUE(item, '$.session_id') AS session_id,
                    JSON_VALUE(item, '$.repository') AS repository,
                    JSON_VALUE(item, '$.commit_sha') AS commit_sha,
                    JSON_VALUE(item, '$.file_path') AS file_path,
                    SAFE_CAST(JSON_VALUE(item, '$.line_number') AS INT64) AS line_number,
                    JSON_VALUE(item, '$.title') AS title,
                    JSON_VALUE(item, '$.description') AS description,
                    JSON_VALUE(item, '$.vulnerability_type') AS vulnerability_type,
                    JSON_VALUE(item, '$.cwe_id') AS cwe_id,
                    JSON_VALUE(item, '$.severity') AS severity,
                    JSON_VALUE(item, '$.status') AS status,
                    JSON_VALUE(item, '$.patch_ref') AS patch_ref,
                    JSON_VALUE(item, '$.pr_url') AS pr_url,
                    JSON_VALUE(item, '$.wiz_issue_id') AS wiz_issue_id,
                    COALESCE(SAFE.TIMESTAMP(JSON_VALUE(item, '$.created_at')), CURRENT_TIMESTAMP()) AS created_at,
                    COALESCE(SAFE.TIMESTAMP(JSON_VALUE(item, '$.updated_at')), CURRENT_TIMESTAMP()) AS updated_at,
                    ROW_NUMBER() OVER (
                      PARTITION BY JSON_VALUE(item, '$.finding_id'), COALESCE(JSON_VALUE(item, '$.repository'), '')
                      ORDER BY JSON_VALUE(item, '$.updated_at') DESC
                    ) AS rn
                  FROM UNNEST(JSON_QUERY_ARRAY(@rows_json)) AS item
                  WHERE JSON_VALUE(item, '$.finding_id') IS NOT NULL
                )
                WHERE rn = 1
              ) AS S
              ON T.finding_id = S.finding_id
                 AND COALESCE(T.repository, '') = COALESCE(S.repository, '')
              WHEN MATCHED THEN
                UPDATE SET
                  issue_id = COALESCE(NULLIF(S.issue_id, ''), T.issue_id),
                  session_id = COALESCE(NULLIF(S.session_id, ''), T.session_id),
                  commit_sha = COALESCE(NULLIF(S.commit_sha, ''), T.commit_sha),
                  file_path = COALESCE(NULLIF(S.file_path, ''), T.file_path),
                  line_number = COALESCE(S.line_number, T.line_number),
                  title = COALESCE(NULLIF(S.title, ''), T.title),
                  description = COALESCE(NULLIF(S.description, ''), T.description),
                  vulnerability_type = COALESCE(NULLIF(S.vulnerability_type, ''), T.vulnerability_type),
                  cwe_id = COALESCE(NULLIF(S.cwe_id, ''), T.cwe_id),
                  severity = COALESCE(NULLIF(S.severity, ''), T.severity),
                  status = COALESCE(NULLIF(S.status, ''), T.status),
                  patch_ref = COALESCE(NULLIF(S.patch_ref, ''), T.patch_ref),
                  pr_url = COALESCE(NULLIF(S.pr_url, ''), T.pr_url),
                  wiz_issue_id = COALESCE(NULLIF(S.wiz_issue_id, ''), T.wiz_issue_id),
                  updated_at = S.updated_at
              WHEN NOT MATCHED THEN
                INSERT (
                  finding_id, issue_id, session_id, repository, commit_sha,
                  file_path, line_number, title, description, vulnerability_type,
                  cwe_id, severity, status, patch_ref, pr_url, wiz_issue_id,
                  created_at, updated_at
                )
                VALUES (
                  S.finding_id,
                  COALESCE(NULLIF(S.issue_id, ''), S.finding_id),
                  S.session_id,
                  S.repository,
                  S.commit_sha,
                  S.file_path,
                  S.line_number,
                  COALESCE(NULLIF(S.title, ''), CONCAT('CodeMender finding ', S.finding_id)),
                  S.description,
                  COALESCE(NULLIF(S.vulnerability_type, ''), 'SECURITY_FINDING'),
                  S.cwe_id,
                  COALESCE(NULLIF(S.severity, ''), 'HIGH'),
                  COALESCE(NULLIF(S.status, ''), 'OPEN'),
                  S.patch_ref,
                  S.pr_url,
                  S.wiz_issue_id,
                  S.created_at,
                  S.updated_at
                )
              """


