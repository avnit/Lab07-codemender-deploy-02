          def run_bq_dml_job(token, billing_projects, sql, rows_batch):
              body = {
                  "configuration": {
                      "query": {
                          "query": sql,
                          "useLegacySql": False,
                          "parameterMode": "NAMED",
                          "queryParameters": [
                              {
                                  "name": "rows_json",
                                  "parameterType": {"type": "STRING"},
                                  "parameterValue": {"value": json.dumps(rows_batch)},
                              }
                          ],
                      }
                  }
              }
              last_err = None
              for job_project in billing_projects:
                  jobs_url = f"https://bigquery.googleapis.com/bigquery/v2/projects/{job_project}/jobs"
                  for attempt in range(1, 6):
                      code, resp = bq_request("POST", jobs_url, token, body)
                      if code == 403 and "bigquery.jobs.create" in json.dumps(resp) and job_project != billing_projects[-1]:
                          print(f"Notice: no bigquery.jobs.create on {job_project}; falling back to {billing_projects[-1]} for query job execution.")
                          last_err = resp
                          break
                      if code == 403:
                          raise BQPermissionError(f"BigQuery job submission forbidden on {job_project} (HTTP 403): {resp}")
                      if code not in (200, 201):
                          msg = json.dumps(resp)
                          if attempt < 5 and (code in (429, 500, 502, 503, 504) or "concurrent update" in msg.lower()):
                              time.sleep((2 ** attempt) + random.uniform(0.2, 1.5))
                              continue
                          raise RuntimeError(f"BigQuery job submission failed on {job_project} (HTTP {code}): {resp}")

                      job_ref = resp.get("jobReference") or {}
                      jid = job_ref.get("jobId")
                      jloc = job_ref.get("location")
                      jproj = job_ref.get("projectId") or job_project
                      poll_url = f"https://bigquery.googleapis.com/bigquery/v2/projects/{jproj}/jobs/{urllib.parse.quote(jid, safe='')}"
                      if jloc:
                          poll_url += f"?location={urllib.parse.quote(jloc, safe='')}"

                      for _ in range(90):
                          p_code, p_resp = bq_request("GET", poll_url, token)
                          if p_code != 200:
                              time.sleep(1.5)
                              continue
                          state = (p_resp.get("status") or {}).get("state")
                          if state == "DONE":
                              err_res = (p_resp.get("status") or {}).get("errorResult")
                              if err_res:
                                  err_msg = str(err_res.get("message") or err_res)
                                  if attempt < 5 and ("concurrent update" in err_msg.lower() or "serialize access" in err_msg.lower()):
                                      wait_s = (2 ** attempt) + random.uniform(0.3, 1.8)
                                      print(f"⏳ Concurrent BigQuery DML detected; retrying in {wait_s:.1f}s (attempt {attempt}/5)...")
                                      time.sleep(wait_s)
                                      break
                                  return {"error": err_msg}
                              dml = ((p_resp.get("statistics") or {}).get("query") or {}).get("dmlStats") or {}
                              return {
                                  "inserted": int(dml.get("insertedRowCount") or 0),
                                  "updated": int(dml.get("updatedRowCount") or 0),
                              }
                          time.sleep(1.5)
                      else:
                          raise RuntimeError(f"Timed out waiting for BigQuery job {jid} in {jproj}")
                      continue
              raise BQPermissionError(f"Unable to submit BigQuery job in {billing_projects}: {last_err}")


          def emit_codemender_cloud_logs(token, bq_project, repo, commit_sha, session_id, cmd_norm, rows, include_findings=False):
              """Write CodeMender events to projects/{bq_project}/logs/codemender.

              - When include_findings=False (direct BQ MERGE already succeeded), emits
                CODEMENDER_SCAN_STARTED, CODEMENDER_PATCH (for patched rows), and
                CODEMENDER_SCAN_COMPLETED so list_security_events and get_issue_logs
                in codemender-mcp-server have full telemetry without duplicating
                rows in codemender.findings.
              - When include_findings=True (fallback if the SA only has roles/logging.logWriter,
                such as github-actions-sa in infra/terraform/iam.tf), also emits
                CODEMENDER_FINDING entries so security-logs-to-pubsub -> security-log-ingestion
                writes the rows into codemender.findings.
              """
              log_name = f"projects/{bq_project}/logs/codemender"
              resource = {"type": "global", "labels": {"project_id": bq_project}}
              now_ts = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              sev_map = {"CRITICAL": "CRITICAL", "HIGH": "ERROR", "MEDIUM": "WARNING", "LOW": "NOTICE"}

              entries = [
                  {
                      "logName": log_name,
                      "timestamp": now_ts,
                      "severity": "INFO",
                      "resource": resource,
                      "jsonPayload": {
                          "event_type": "CODEMENDER_SCAN_STARTED",
                          "status": "STARTED",
                          "repository": repo,
                          "commit_sha": commit_sha,
                          "session_id": session_id,
                          "message": f"CodeMender {cmd_norm} workflow started for {repo}@{commit_sha[:8]}",
                      },
                  }
              ]

              for r in rows:
                  log_sev = sev_map.get(str(r.get("severity") or "").upper(), "WARNING")
                  if include_findings:
                      payload = dict(r)
                      payload["event_type"] = "CODEMENDER_FINDING"
                      payload["message"] = (
                          f"CodeMender finding {r['finding_id']} ({r.get('cwe_id') or r.get('vulnerability_type') or 'SECURITY'}) "
                          f"in {r.get('file_path') or 'repo'}:{r.get('line_number') or 0}"
                      )
                      entries.append(
                          {
                              "logName": log_name,
                              "timestamp": now_ts,
                              "severity": log_sev,
                              "resource": resource,
                              "labels": {
                                  "finding_id": str(r["finding_id"]),
                                  "issue_id": str(r.get("issue_id") or r["finding_id"]),
                              },
                              "jsonPayload": payload,
                          }
                      )
                  elif r.get("pr_url") or r.get("patch_ref"):
                      entries.append(
                          {
                              "logName": log_name,
                              "timestamp": now_ts,
                              "severity": "NOTICE",
                              "resource": resource,
                              "labels": {
                                  "finding_id": str(r["finding_id"]),
                                  "issue_id": str(r.get("issue_id") or r["finding_id"]),
                              },
                              "jsonPayload": {
                                  "event_type": "CODEMENDER_PATCH",
                                  "finding_id": r["finding_id"],
                                  "issue_id": r.get("issue_id") or r["finding_id"],
                                  "session_id": r.get("session_id") or session_id,
                                  "repository": repo,
                                  "commit_sha": commit_sha,
                                  "file_path": r.get("file_path"),
                                  "severity": r.get("severity"),
                                  "status": r.get("status"),
                                  "patch_ref": r.get("patch_ref"),
                                  "pr_url": r.get("pr_url"),
                                  "message": f"CodeMender patch available for {r['finding_id']} ({r.get('pr_url') or r.get('patch_ref')})",
                              },
                          }
                      )

              entries.append(
                  {
                      "logName": log_name,
                      "timestamp": now_ts,
                      "severity": "INFO",
                      "resource": resource,
                      "jsonPayload": {
                          "event_type": "CODEMENDER_SCAN_COMPLETED",
                          "status": "COMPLETED",
                          "repository": repo,
                          "commit_sha": commit_sha,
                          "session_id": session_id,
                          "message": f"CodeMender {cmd_norm} workflow completed: {len(rows)} finding(s)",
                      },
                  }
              )

              write_url = "https://logging.googleapis.com/v2/entries:write"
              for idx in range(0, len(entries), 100):
                  l_code, l_resp = bq_request("POST", write_url, token, {"entries": entries[idx:idx + 100]})
                  if l_code not in (200, 201):
                      return False, f"HTTP {l_code}: {l_resp}"
              return True, f"Wrote {len(entries)} Cloud Logging event(s) to {log_name}"


          def append_summary(markdown_text):
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as sf:
                      sf.write(markdown_text + "\n")


          def main():
              artifacts_dir = "./cm-artifacts"
              repo = os.environ.get("REPO_NAME", "").strip()
              target_ref = os.environ.get("TARGET_REF", "main").strip()
              commit_sha = os.environ.get("COMMIT_SHA", "").strip() or target_ref
              slug = os.environ.get("SLUG", "root").strip()
              cmd_norm = normalize_command(os.environ.get("CMD", "find"))
              vuln_id = os.environ.get("VULN_ID", "").strip()
              run_id = os.environ.get("RUN_ID", "manual").strip()
              artifacts_bucket = os.environ.get("ARTIFACTS_BUCKET", "").strip()
              worker_project = os.environ.get("WORKER_PROJECT_ID", "cm-gh-506516").strip()
              bq_project = os.environ.get("BQ_PROJECT_ID", "").strip() or worker_project
              bq_dataset = os.environ.get("BQ_DATASET", "codemender").strip()
              bq_table = os.environ.get("BQ_TABLE", "findings").strip()
              bq_location = os.environ.get("BQ_LOCATION", "US").strip()

              for ident_name, ident_val in (("BQ_PROJECT_ID", bq_project), ("BQ_DATASET", bq_dataset), ("BQ_TABLE", bq_table)):
                  if not IDENTIFIER_RE.match(ident_val):
                      raise SystemExit(f"Invalid {ident_name}: {ident_val!r}")

              now_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              default_session_id = resolve_session_id(artifacts_dir, run_id, slug)

              # 1. Parse findings from structured JSON, SARIF, and CLI logs
              records = parse_json_findings(artifacts_dir, repo)
              records = enrich_or_parse_sarif(artifacts_dir, repo, records)
              if not records:
                  records = parse_cli_log_fallback(artifacts_dir, repo)

              # 2. Fetch GitHub PRs and tracking issues for status, pr_url, patch_ref, and issue_id enrichment
              prs_by_fid, issues_by_fid = fetch_github_context(repo)

              # 3. Handle single-finding verify/fix runs even when findings.json was not re-emitted
              if cmd_norm in ("verify", "fix") and vuln_id:
                  fid_norm = vuln_id[:8].lower() if HEX_ID_RE.match(vuln_id) else vuln_id
                  if fid_norm not in records:
                      records[fid_norm] = {
                          "finding_id": fid_norm,
                          "issue_id": fid_norm,
                          "session_id": default_session_id,
                          "file_path": None,
                          "line_number": None,
                          "title": None,
                          "description": None,
                          "vulnerability_type": None,
                          "cwe_id": None,
                          "severity": None,
                          "status": None,
                          "patch_ref": None,
                          "pr_url": None,
                          "wiz_issue_id": None,
                      }

              if not records:
                  msg = f"ℹ️ No CodeMender findings found in `{artifacts_dir}` for `{cmd_norm}` run; skipping BigQuery upload."
                  print(msg)
                  append_summary(f"\n### 📊 BigQuery Findings Sync (`{bq_project}.{bq_dataset}.{bq_table}`)\n{msg}\n")
                  return

              # 4. Enrich each finding with GitHub Issue metadata, verify logs, fix logs, and PR links
              rows = []
              for fid, rec in sorted(records.items()):
                  iss = issues_by_fid.get(fid.lower())
                  if iss:
                      meta = iss.get("_parsed_meta") or {}
                      iss_num = iss.get("number")
                      if iss_num and (not rec.get("issue_id") or rec["issue_id"] == fid):
                          rec["issue_id"] = f"GH-{iss_num}"
                      if not rec.get("file_path") and meta.get("file"):
                          rec["file_path"] = clean_file_path(meta.get("file"))
                      if not rec.get("line_number") and meta.get("start_line"):
                          rec["line_number"] = parse_int(meta.get("start_line"))
                      if not rec.get("title") and iss.get("title"):
                          rec["title"] = clean_title(iss.get("title"))
                      cwe_m, vtype_m = normalize_cwe_and_type(meta.get("cwe"), meta.get("vuln_type"), rec.get("title") or "")
                      if not rec.get("cwe_id") and cwe_m:
                          rec["cwe_id"] = cwe_m
                      if not rec.get("vulnerability_type") and vtype_m:
                          rec["vulnerability_type"] = vtype_m
                      if not rec.get("severity") and meta.get("severity"):
                          rec["severity"] = normalize_severity(meta.get("severity"))

                  # Inspect verify logs (per-finding or single-finding run, top-level or nested)
                  v_log = find_artifact_log(artifacts_dir, f"cm-verify-{fid}.log")
                  if not v_log and cmd_norm == "verify" and (not vuln_id or fid.lower() == vuln_id[:8].lower()):
                      v_log = find_artifact_log(artifacts_dir, "cm-verify.log")
                  verify_verdict = evaluate_verify_log(v_log)
                  if verify_verdict:
                      rec["status"] = verify_verdict

                  # Inspect fix logs and remediation PRs
                  f_log = find_artifact_log(artifacts_dir, f"cm-fix-{fid}.log")
                  if not f_log and cmd_norm == "fix" and (not vuln_id or fid.lower() == vuln_id[:8].lower()):
                      f_log = find_artifact_log(artifacts_dir, "cm-fix.log")

                  pr = prs_by_fid.get(fid.lower())
                  if pr:
                      rec["pr_url"] = pr.get("url") or rec.get("pr_url")
                      rec["patch_ref"] = pr.get("headRefName") or rec.get("patch_ref")
                      if str(pr.get("state") or "").upper() == "MERGED":
                          rec["status"] = "FIXED"
                      elif rec.get("status") not in ("FIXED", "FALSE_POSITIVE"):
                          rec["status"] = "PATCH_GENERATED"
                  elif f_log and "Session FAILED" not in f_log and "no finding matches prefix" not in f_log:
                      if rec.get("status") not in ("FIXED", "FALSE_POSITIVE"):
                          rec["status"] = "PATCH_GENERATED"
                      if not rec.get("patch_ref") and artifacts_bucket:
                          rec["patch_ref"] = f"gs://{artifacts_bucket}/{repo}/{target_ref}/fix/{fid}/"

                  rows.append(
                      {
                          "finding_id": fid,
                          "issue_id": rec.get("issue_id") or fid,
                          "session_id": rec.get("session_id") or default_session_id,
                          "repository": repo or None,
                          "commit_sha": commit_sha or None,
                          "file_path": rec.get("file_path"),
                          "line_number": rec.get("line_number"),
                          "title": rec.get("title"),
                          "description": rec.get("description"),
                          "vulnerability_type": rec.get("vulnerability_type"),
                          "cwe_id": rec.get("cwe_id"),
                          "severity": rec.get("severity"),
                          "status": rec.get("status") or "OPEN",
                          "patch_ref": rec.get("patch_ref"),
                          "pr_url": rec.get("pr_url"),
                          "wiz_issue_id": rec.get("wiz_issue_id"),
                          "created_at": now_iso,
                          "updated_at": now_iso,
                      }
                  )

              # 5. Archive normalized JSONL locally inside ./cm-artifacts/ for auditability
              os.makedirs(artifacts_dir, exist_ok=True)
              jsonl_path = os.path.join(artifacts_dir, "bq-findings.jsonl")
              with open(jsonl_path, "w", encoding="utf-8") as jf:
                  for r in rows:
                      jf.write(json.dumps(r) + "\n")
              print(f"📝 Wrote {len(rows)} normalized finding row(s) to {jsonl_path}")

              # 6. Authenticate and upsert into BigQuery codemender.findings (with Cloud Logging sink fallback)
              token = subprocess.check_output(["gcloud", "auth", "print-access-token"], text=True, timeout=15).strip()
              sync_mode = "Direct BigQuery MERGE"
              total_inserted = 0
              total_updated = 0

              try:
                  ensure_dataset_and_table(token, bq_project, bq_dataset, bq_table, bq_location)
                  full_table = f"`{bq_project}.{bq_dataset}.{bq_table}`"
                  merge_sql = build_merge_sql(full_table)
                  billing_projects = [bq_project] if bq_project == worker_project else [bq_project, worker_project]

                  batch_size = 50
                  for idx in range(0, len(rows), batch_size):
                      batch = rows[idx:idx + batch_size]
                      result = run_bq_dml_job(token, billing_projects, merge_sql, batch)
                      if "error" in result:
                          if "streaming buffer" in result["error"].lower():
                              print("Notice: target rows in BigQuery streaming buffer; inserting net-new rows only.")
                              fallback_res = run_bq_dml_job(token, billing_projects, build_insert_missing_sql(full_table), batch)
                              if "error" in fallback_res:
                                  raise RuntimeError(f"BigQuery fallback insert failed: {fallback_res['error']}")
                              total_inserted += fallback_res["inserted"]
                          else:
                              raise RuntimeError(f"BigQuery MERGE failed: {result['error']}")
                      else:
                          total_inserted += result["inserted"]
                          total_updated += result["updated"]

                  print(
                      f"✅ Synced {len(rows)} finding(s) to BigQuery {bq_project}.{bq_dataset}.{bq_table} "
                      f"(inserted={total_inserted}, updated={total_updated})"
                  )
                  # Best-effort emit scan/patch lifecycle events to Cloud Logging without duplicating finding rows
                  emit_codemender_cloud_logs(
                      token, bq_project, repo, commit_sha, default_session_id, cmd_norm, rows, include_findings=False
                  )
              except BQPermissionError as bq_perm_err:
                  print(
                      f"Notice: Direct BigQuery write denied ({bq_perm_err}); "
                      f"falling back to Cloud Logging sink projects/{bq_project}/logs/codemender -> security-log-ingestion..."
                  )
                  ok, log_msg = emit_codemender_cloud_logs(
                      token, bq_project, repo, commit_sha, default_session_id, cmd_norm, rows, include_findings=True
                  )
                  if not ok:
                      raise RuntimeError(
                          f"Direct BigQuery MERGE failed ({bq_perm_err}) and Cloud Logging fallback failed ({log_msg}). "
                          f"Grant roles/bigquery.dataEditor on {bq_project}.{bq_dataset} + roles/bigquery.jobUser on {bq_project} "
                          f"(or roles/logging.logWriter on {bq_project}) to the workflow service account."
                      ) from bq_perm_err
                  sync_mode = f"Cloud Logging Sink (`projects/{bq_project}/logs/codemender` -> `security-log-ingestion`)"
                  total_inserted = len(rows)
                  print(f"✅ Published {len(rows)} finding(s) via {sync_mode}: {log_msg}")

              summary_lines = [
                  f"\n### 📊 BigQuery MCP Findings Sync (`{bq_project}.{bq_dataset}.{bq_table}`)",
                  f"- **Delivery Path:** {sync_mode}",
                  f"- **Processed Findings:** `{len(rows)}` (`{total_inserted}` inserted, `{total_updated}` updated)",
                  f"- **Session ID:** `{default_session_id}`",
                  "",
                  "| Finding ID | Severity | Status | Type / CWE | Location | PR |",
                  "| :--- | :--- | :--- | :--- | :--- | :--- |",
              ]
              for r in rows[:50]:
                  loc = f"`{r['file_path']}:{r['line_number']}`" if r.get("file_path") and r.get("line_number") else (f"`{r['file_path']}`" if r.get("file_path") else "—")
                  vtype = " / ".join(x for x in (r.get("vulnerability_type"), r.get("cwe_id")) if x) or "—"
                  pr_cell = f"[PR]({r['pr_url']})" if r.get("pr_url") else "—"
                  summary_lines.append(
                      f"| `{r['finding_id']}` | `{r.get('severity') or 'HIGH'}` | `{r.get('status') or 'OPEN'}` | `{vtype}` | {loc} | {pr_cell} |"
                  )
              append_summary("\n".join(summary_lines))


          if __name__ == "__main__":
              main()
          PYEOF

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: codemender-manual-${{ github.run_id }}-${{ steps.slug.outputs.slug }}
          path: ./cm-artifacts/
          retention-days: 30